<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Agendamento - Barbearia</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">

    <div class="max-w-xl mx-auto bg-gray-800 p-6 rounded-xl shadow-lg">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-amber-500">Agende seu Horário</h1>
            <button id="btnLogout" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm transition">Sair</button>
        </div>

        <form id="agendamentoForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Seu Nome</label>
                <input type="text" id="nomeCliente" required class="w-full px-3 py-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Serviço</label>
                <select id="servico" class="w-full px-3 py-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-amber-500">
                    <option value="Corte Cabelo">Corte de Cabelo - R$ 40</option>
                    <option value="Barba">Barba - R$ 30</option>
                    <option value="Corte + Barba">Corte + Barba - R$ 60</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Data e Horário</label>
                <input type="datetime-local" id="dataHora" required class="w-full px-3 py-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-amber-500">
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold py-2 rounded transition duration-200">Confirmar Agendamento</button>
        </form>

        <p id="msgStatus" class="mt-4 text-center text-sm text-green-400"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDGjisHwvyBNHoZvS0DP-BTcXYufU6b5YY",
            authDomain: "agendamento-barbearia-e8ffb.firebaseapp.com",
            projectId: "agendamento-barbearia-e8ffb",
            storageBucket: "agendamento-barbearia-e8ffb.firebasestorage.app",
            messagingSenderId: "399463668114",
            appId: "1:399463668114:web:c9f20b3dbc80745891894b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "index.html";
            }
        });

        document.getElementById('btnLogout').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        });

        const form = document.getElementById('agendamentoForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nomeCliente = document.getElementById('nomeCliente').value;
            const servico = document.getElementById('servico').value;
            const dataHora = document.getElementById('dataHora').value;
            const msgStatus = document.getElementById('msgStatus');

            try {
                await addDoc(collection(db, "agendamentos"), {
                    cliente: nomeCliente,
                    servico: servico,
                    dataHora: dataHora,
                    criadoEm: new Date()
                });

                msgStatus.innerText = "Agendamento realizado com sucesso!";
                form.reset();
            } catch (error) {
                msgStatus.className = "mt-4 text-center text-sm text-red-400";
                msgStatus.innerText = "Erro ao agendar: " + error.message;
            }
        });
    </script>
</body>
</html>
